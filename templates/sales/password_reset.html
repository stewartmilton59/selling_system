{% extends 'base.html' %}

{% block title %}Reset Password - ProSell{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-key display-1 text-primary"></i>
                            <h3 class="fw-bold mt-3">Reset Password</h3>
                            <p class="text-muted">Enter your email to receive reset instructions</p>
                        </div>
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-4">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="bi bi-send me-2"></i>Send Reset Link
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-0">Remember your password? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
