{% extends 'base.html' %}

{% block title %}Password Reset Complete - ProSell{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-check-circle-fill display-1 text-success"></i>
                        <h3 class="fw-bold mt-3">Password Reset Complete</h3>
                        <p class="text-muted">Your password has been successfully reset. You can now log in with your new password.</p>
                        <a href="{% url 'login' %}" class="btn btn-primary mt-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
