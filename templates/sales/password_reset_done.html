{% extends 'base.html' %}

{% block title %}Password Reset Sent - ProSell{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-envelope-check display-1 text-success"></i>
                        <h3 class="fw-bold mt-3">Check Your Email</h3>
                        <p class="text-muted">We've sent you an email with instructions to reset your password. Please check your inbox.</p>
                        <a href="{% url 'login' %}" class="btn btn-primary mt-3">
                            <i class="bi bi-arrow-left me-2"></i>Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
